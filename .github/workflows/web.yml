name: Web page

on:
  push:
    paths:
      - 'index.html'
      - 'vendor/**'
      - 'tools/remote-test/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'vendor/**'
      - 'tools/remote-test/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/remote-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/remote-test/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-screenshots
          path: tools/remote-test/screenshots/
          if-no-files-found: ignore
